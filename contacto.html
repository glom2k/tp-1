<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://kit.fontawesome.com/422d45ed3a.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="./index.html" class="logo"><i class="fa-solid fa-compact-disc"></i></i>Vinyl boutique</a>
            <ul class="nav-links">
                <li> <a href="./index.html">Inicio</a></li>
                <li><a href="./nuestro-espacio.html">Nuestro espacio</a></li>
                <li><a href="./galeria.html">Galería</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main>
    <h1 class="page-title">Contacto</h1>

    <section class="contact-section">
    <form action="#" method="POST">
        <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required />
        </div>

        <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="tunombre@ejemplo.com" required />
        </div>

        <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" name="phone" placeholder="+54 11 1234-5678" required />
        </div>

        <div class="form-group">
        <label for="reason">Motivo de contacto</label>
        <select id="reason" name="reason" required>
            <option value="" disabled selected>Seleccioná una opción</option>
            <option value="reserva">Reservar una fecha</option>
            <option value="eventos">Preguntar por un álbum</option>
            <option value="trabajo">Trabajá con nosotros</option>
            <option value="otro">Otro</option>
        </select>
        </div>

        <fieldset>
        <legend>Ya escuchaste a tu artista favorito en nuestro formato?</legend>
        <div class="radio-group">
            <div>
            <input type="radio" id="first-yes" name="first-visit" value="si" required />
            <label for="first-yes">Sí</label>
            </div>
            <div>
            <input type="radio" id="first-no" name="first-visit" value="no" required />
            <label for="first-no">No</label>
            </div>
        </div>
        </fieldset>

        <div class="form-group">
        <label for="comment">Mensaje</label>
        <textarea id="comment" name="comment" placeholder="Contanos en qué te podemos ayudar..." required></textarea>
        </div>

        <div class="form-buttons">
        <button type="submit" class="btn btn-primary">Enviar mensaje</button>
        <button type="reset" class="btn btn-secondary">Limpiar formulario</button>
        </div>
    </form>
    </section>
</main>
    <footer>
        <ul class="nav-footer">
                <li> <a href="./index.html">Inicio</a></li>
                <li><a href="./nuestro-espacio.html">Nuestro espacio</a></li>

                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
            <p class="footer-text">© 2026 Vinyl boutique. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
